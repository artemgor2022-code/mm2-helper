<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MM2 Trade Helper</title>
  <style>
    body {
      width: 250px;
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    h2 { margin: 0 0 10px 0; font-size: 18px; }
    p { color: #888; font-size: 13px; margin: 5px 0; }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00b06f;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h2>MM2 Trade Helper</h2>
  <p><span class="status"></span>Расширение активно</p>
  <p>Цены обновляются автоматически</p>
</body>
</html>
